# Sveltia CMS (Visual editor / Storage mapping). Served at <base>/admin/.
# Local editing: open /admin/ in a Chromium browser on the dev server and choose
# "Work with Local Repository" (File System Access API, no auth).
backend:
  name: github
  repo: OWNER/REPO # TODO: repo name still open (map)
  branch: main
  base_url: https://sveltia-cms-auth.OWNER.workers.dev # TODO: OAuth Worker (owner sets up)
  open_authoring: true
  auth_scope: public_repo

media_folder: src/assets/media
public_folder: '@media'

output:
  omit_empty_optional_fields: true

# FR at the root, EN under en/ (Starlight). Shared fields (i18n: false) are saved to the French file only.
i18n:
  structure: multiple_folders
  locales: [fr, en]
  default_locale: fr
  omit_default_locale_from_file_path: true
  initial_locales: default # TODO verify: new entries start French-only; EN can be enabled per entry

# ---------------------------------------------------------------- shared field snippets
x-title: &title { name: title, label: Titre, widget: string, i18n: true }
x-description: &description { name: description, label: Résumé, widget: string, required: false, i18n: true }
x-body: &body { name: body, label: Texte, widget: richtext, i18n: true }
x-tr: &tr # a translated string inside shared data: { fr, en }
  widget: object
  i18n: false
  required: false
  fields:
    - { name: fr, label: Français, widget: text }
    - { name: en, label: English, widget: text, required: false }
x-requirements: &requirements
  name: requirements
  label: Exigences
  widget: list
  i18n: false
  required: false
  fields:
    - { name: level, label: Niveau, widget: select, options: [required, recommended, optional] }
    - name: target
      label: Cible
      widget: object
      typeKey: type
      types:
        - name: duty
          label: Duty
          fields: [{ name: duty, widget: relation, collection: fow-duties, value_field: 'fow/duties/{{slug}}', display_fields: [label] }]
        - name: role
          label: Rôle
          fields: [{ name: role, widget: relation, collection: fow-roles, value_field: 'fow/roles/{{slug}}', display_fields: [label] }]
        - name: zone
          label: Zone
          fields: [{ name: zone, widget: relation, collection: zones, value_field: '{{slug}}', display_fields: [title] }]
    - { <<: *tr, name: reason, label: Raison }
x-armor: &armor
  widget: object
  required: false
  fields:
    - { name: insignia, label: Insigne, widget: relation, collection: gear-insignias, value_field: 'gear/insignias/{{slug}}', required: false }
    - { name: rune, label: Rune, widget: relation, collection: gear-runes, value_field: 'gear/runes/{{slug}}', required: false }
x-loadout: &loadout
  name: loadout
  label: Équipement porté
  widget: object
  i18n: false
  required: false
  fields:
    - name: weaponSets
      label: Sets d'armes
      widget: list
      required: false
      fields:
        - { name: id, widget: string }
        - { name: weapons, widget: relation, collection: gear-weapons, value_field: 'gear/weapons/{{slug}}', multiple: true }
    - name: armor
      label: Armure
      widget: object
      required: false
      fields:
        - { <<: *armor, name: head, label: Tête, fields: [{ name: insignia, label: Insigne, widget: relation, collection: gear-insignias, value_field: 'gear/insignias/{{slug}}', required: false }, { name: rune, label: Rune, widget: relation, collection: gear-runes, value_field: 'gear/runes/{{slug}}', required: false }, { name: attribute, label: Attribut (ID), widget: number, value_type: int, required: false }] }
        - { <<: *armor, name: chest, label: Torse }
        - { <<: *armor, name: hands, label: Mains }
        - { <<: *armor, name: legs, label: Jambes }
        - { <<: *armor, name: feet, label: Pieds }
x-mdx: &mdx
  extension: mdx
  format: frontmatter
  create: true
  i18n: true

collections:
  # ------------------------------------------------------------ Zones and their Roles / Duties
  - <<: *mdx
    name: zones
    label: Zones
    folder: src/content/docs/{{locale}}
    path: '{{slug}}/index'
    filter: { field: kind, value: zone }
    fields:
      - *title
      - *description
      - { name: kind, widget: hidden, default: zone, i18n: false }
      - { name: roles, label: Rôles, widget: relation, collection: fow-roles, value_field: 'fow/roles/{{slug}}', display_fields: [label], multiple: true, i18n: false }
      - { name: duties, label: "Duties (ordre du run)", widget: relation, collection: fow-duties, value_field: 'fow/duties/{{slug}}', display_fields: [label], multiple: true, i18n: false }
      - name: runs
        label: Runs complets
        widget: list
        i18n: false
        required: false
        fields:
          - { name: id, widget: string }
          - { name: youtube, label: ID YouTube, widget: string }
          - { name: setup, widget: relation, collection: party-setups, display_fields: [label] }
          - { name: date, widget: datetime, time_format: false, format: YYYY-MM-DD }
          - { name: runner, widget: string }
          - { name: lang, widget: select, options: [fr, en, none] }
      - *body
  - <<: *mdx
    name: fow-roles
    label: FoW — Rôles
    folder: src/content/docs/{{locale}}/fow/roles
    identifier_field: label
    fields:
      - *title
      - *description
      - { name: kind, widget: hidden, default: role, i18n: false }
      - { name: label, widget: string, i18n: false }
      - { name: build, widget: relation, collection: vos-builds, value_field: 'builds/vos/{{slug}}', i18n: false }
      - *body
  - <<: *mdx
    name: fow-duties
    label: FoW — Duties
    folder: src/content/docs/{{locale}}/fow/duties
    identifier_field: label
    fields:
      - *title
      - *description
      - { name: kind, widget: hidden, default: duty, i18n: false }
      - { name: label, widget: string, i18n: false }
      - name: run
        label: Extrait du run complet
        widget: object
        required: false
        i18n: false
        fields:
          - { name: id, label: ID du run (Zone), widget: string }
          - { name: at, label: "Horodatage (m:ss)", widget: string, pattern: ['^\d+(:\d{2}){1,2}$', 'm:ss ou h:mm:ss'] }
      - *body

  # ------------------------------------------------------------ Build cores and Builds
  - <<: *mdx
    name: cores
    label: Build cores
    folder: src/content/docs/{{locale}}/builds
    path: '{{slug}}/index'
    filter: { field: kind, value: core }
    fields:
      - *title
      - *description
      - { name: kind, widget: hidden, default: core, i18n: false }
      - { name: label, widget: string, i18n: false }
      - { name: code, label: Code du template (cases libres vides), widget: string, i18n: false }
      - *loadout
      - *body
  - <<: *mdx
    name: vos-builds
    label: Builds VoS
    folder: src/content/docs/{{locale}}/builds/vos
    filter: { field: kind, value: build }
    fields:
      - *title
      - *description
      - { name: kind, widget: hidden, default: build, i18n: false }
      - { name: core, widget: hidden, default: builds/vos, i18n: false }
      - { name: code, label: Code du template (testé en jeu), widget: string, i18n: false }
      - *loadout
      - name: skillNotes
        label: Notes par compétence
        widget: list
        i18n: false
        required: false
        fields:
          - { name: skill, label: ID de compétence, widget: number, value_type: int }
          - { <<: *tr, name: note, label: Note }
          - name: alternatives
            widget: list
            required: false
            fields:
              - { name: skill, label: ID de compétence, widget: number, value_type: int }
              - { <<: *tr, name: note, label: Note }
      - *body

  # ------------------------------------------------------------ Gear (type = folder)
  - &gear
    <<: *mdx
    name: gear-runes
    label: Équipement — Runes
    folder: src/content/docs/{{locale}}/gear/runes
    fields:
      - *title
      - *description
      - { name: kind, widget: hidden, default: gear, i18n: false }
      - { name: modId, label: ID du mod (build-wars), widget: number, value_type: int, i18n: false }
      - *requirements
      - *body
  - <<: *gear
    name: gear-insignias
    label: Équipement — Insignes
    folder: src/content/docs/{{locale}}/gear/insignias
  - <<: *mdx
    name: gear-weapons
    label: Équipement — Armes
    folder: src/content/docs/{{locale}}/gear/weapons
    fields:
      - *title
      - *description
      - { name: kind, widget: hidden, default: gear, i18n: false }
      - { name: base, label: ID de l'arme de base (build-wars), widget: number, value_type: int, required: false, i18n: false }
      - { name: mods, label: IDs des mods, widget: list, field: { name: mod, widget: number, value_type: int }, required: false, i18n: false }
      - { name: gwwTitle, label: Titre GWW (objet PvE nommé), widget: string, required: false, i18n: false }
      - *requirements
      - *body

  # ------------------------------------------------------------ Consumables (kind = folder)
  - &consumable
    <<: *mdx
    name: consumables-cons
    label: Consommables — Cons
    folder: src/content/docs/{{locale}}/consumables/cons
    fields:
      - *title
      - *description
      - { name: kind, widget: hidden, default: consumable, i18n: false }
      - { name: gwwTitle, label: Titre GWW (anglais), widget: string, i18n: false }
      - { name: nameFr, label: Nom français (vérifié), widget: string, i18n: false }
      - *requirements
      - *body
  - { <<: *consumable, name: consumables-summoning-stones, label: Consommables — Pierres d'invocation, folder: 'src/content/docs/{{locale}}/consumables/summoning-stones' }
  - { <<: *consumable, name: consumables-powerstones, label: Consommables — Pierres de puissance, folder: 'src/content/docs/{{locale}}/consumables/powerstones' }
  - { <<: *consumable, name: consumables-sweets-alcohol, label: Consommables — Sucreries / alcool, folder: 'src/content/docs/{{locale}}/consumables/sweets-alcohol' }
  - { <<: *consumable, name: consumables-other, label: Consommables — Autre, folder: 'src/content/docs/{{locale}}/consumables/other' }

  # ------------------------------------------------------------ Data without pages
  - name: party-setups
    label: Party setups
    folder: src/content/party-setups
    extension: yaml
    format: yaml
    create: true
    identifier_field: label
    fields:
      - { name: zone, widget: relation, collection: zones, display_fields: [title] }
      - { name: label, widget: string }
      - { name: default, label: Setup par défaut, widget: boolean, default: false }
      - name: roles
        widget: list
        fields:
          - { name: role, widget: relation, collection: fow-roles, value_field: 'fow/roles/{{slug}}', display_fields: [label] }
          - { name: duties, widget: relation, collection: fow-duties, value_field: 'fow/duties/{{slug}}', display_fields: [label], multiple: true }
  - name: settings
    label: Réglages
    files:
      - name: skill-nicknames
        label: Surnoms de compétences
        file: src/content/skill-nicknames.yaml
        fields:
          - name: nicknames
            widget: list
            root: true
            fields:
              - { name: skill, label: ID de compétence, widget: number, value_type: int }
              - { name: nickname, label: Surnom, widget: string }

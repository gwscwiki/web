name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # @buildwars/gw-templates expects Node 24
          cache: npm
      - run: npm ci
      # Game data is fetched at build time, never committed. Cache the downloads (keyed by the pinned
      # build-wars commit in src/lib/gw/source.mjs) and Astro's data store, so an upstream outage only
      # breaks a deploy when the pin changes.
      - uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache/gw-data
            node_modules/.astro
          key: gw-data-${{ hashFiles('src/lib/gw/source.mjs') }}
      # Icons fetched from the Guild Wars Wiki for the pages in use (scripts/sync-icons.mjs). Keep the
      # cache across runs so only new icons are downloaded; restore the newest one available.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/gw-icons
          key: gw-icons-${{ github.sha }}
          restore-keys: gw-icons-
      - run: npm run check:content
      - run: npm run check:styles
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
